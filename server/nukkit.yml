settings:
  language: "rus"
  force-language: true
  shutdown-message: "FrostLand закрыт"
  query-plugins: true
  deprecated-verbose: true
  async-workers: auto
  safe-spawn: true
  waterdogpe: false
  download-spark: false

network:
  batch-threshold: 256
  compression-level: 7
  compression-buffer-size: 1048576
  async-compression: false
  zlib-provider: 3
  snappy: false

debug:
  level: 1
  commands: false
  ignored-packets:
    - LevelChunkPacket

level-settings:
  default-format: leveldb
  auto-tick-rate: true
  auto-tick-rate-limit: 20
  base-tick-rate: 1
  always-tick-players: false
  tick-redstone: true
  chunk-unload-delay: 15000

chunk-sending:
  per-tick: 8
  max-chunks: 192
  spawn-threshold: 56

chunk-ticking:
  per-tick: 40
  tick-radius: 3
  light-updates: true
  clear-tick-list: false

chunk-generation:
  queue-size: 16

ticks-per:
  animal-spawns: 400
  monster-spawns: 1
  autosave: 6000
  cache-cleanup: 900

spawn-limits:
  monsters: 70
  animals: 15
  water-animals: 5
  ambient: 15

player:
  save-player-data: true
  skin-change-cooldown: 30
  force-skin-trusted: false
  check-movement: true

aliases:

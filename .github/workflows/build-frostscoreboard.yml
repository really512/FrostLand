name: Build FrostScoreboard

on:
  push:
    paths:
      - "plugins/FrostScoreboard/**"
      - ".github/workflows/build-frostscoreboard.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/FrostScoreboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Maven project
        run: |
          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>ru.frostland</groupId>
            <artifactId>FrostScoreboard</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.source>21</maven.compiler.source>
              <maven.compiler.target>21</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <dependencies>
              <dependency>
                <groupId>cn.powernukkitx</groupId>
                <artifactId>powernukkitx</artifactId>
                <version>2.0.0</version>
                <scope>system</scope>
                <systemPath>${project.basedir}/../../server/powernukkitx-2.0.0.jar</systemPath>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: plugins/FrostScoreboard/pom.xml

      - name: Download official PowerNukkitX 2.0.0 API JAR
        working-directory: .
        run: |
          mkdir -p server
          curl -fL --retry 3 --retry-delay 2             -o server/powernukkitx-2.0.0.jar             https://github.com/PowerNukkitX/PowerNukkitX/releases/download/2.0.0/powernukkitx.jar
          test -s server/powernukkitx-2.0.0.jar

      - name: Verify PowerNukkitX JAR
        working-directory: .
        run: |
          test -s server/powernukkitx-2.0.0.jar
          sha256sum server/powernukkitx-2.0.0.jar
          jar tf server/powernukkitx-2.0.0.jar >/dev/null

      - name: Build JAR
        run: mvn -B package

      - name: Prepare FrostLand server package
        working-directory: .
        run: |
          mkdir -p server-package/plugins
          cp server/powernukkitx-2.0.0.jar server-package/powernukkitx-2.0.0.jar
          cp plugins/FrostScoreboard/target/FrostScoreboard-1.0.0.jar server-package/plugins/FrostScoreboard.jar
          cp server/nukkit.yml server-package/nukkit.yml
          cp server/server.properties server-package/server.properties
          cp server/permissions.yml server-package/permissions.yml
          cp server/whitelist.json server-package/whitelist.json
          cp server/ops.json server-package/ops.json
          cp -r config server-package/config
          find server-package -type f -print

      - name: Test-start PowerNukkitX
        working-directory: server-package
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 45s java -jar powernukkitx-2.0.0.jar > server-test.log 2>&1
          code=$?
          cat server-test.log
          if [ "$code" -ne 124 ] && [ "$code" -ne 143 ] && [ "$code" -ne 137 ]; then
            echo "PowerNukkitX завершился неожиданно с кодом $code"
            exit "$code"
          fi
          echo "PowerNukkitX успешно запускался в тестовом режиме до тайм-аута."

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostScoreboard
          path: plugins/FrostScoreboard/target/FrostScoreboard-1.0.0.jar

      - name: Upload FrostLand server package
        uses: actions/upload-artifact@v4
        with:
          name: FrostLand-server-2.0.0
          path: server-package/

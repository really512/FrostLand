# FrostLand — правила и наказания
# Формат: нарушение -> первое нарушение -> повторное нарушение

checkcheat:
  method: "Discord"
  restrictions:
    - "Нельзя двигаться во время проверки."
    - "Нельзя выходить с сервера во время проверки."
    - "Нельзя писать команды во время проверки."
    - "Нельзя оскорблять модератора во время проверки."
    - "Во время проверки требуется демонстрация экрана."
  note: "Проверка проводится через Discord."
  screen_share_required: true
  no_screen_share_penalty: "🔨 30 дней"

penalties:
  - violation: "Флуд"
    first: "🔇 10 мин"
    repeat: "🔇 30 мин"
  - violation: "Спам"
    first: "🔇 30 мин"
    repeat: "🔇 2 ч"
  - violation: "Оскорбление"
    first: "🔇 30 мин"
    repeat: "🔇 2 ч"
  - violation: "Тяжёлое оскорбление"
    first: "🔇 2 ч"
    repeat: "🔇 6 ч"
  - violation: "Провокация"
    first: "🔇 30 мин"
    repeat: "🔇 2 ч"
  - violation: "Угрозы"
    first: "🔇 5 ч"
    repeat: "🔇 12 ч"
  - violation: "Реклама стороннего проекта"
    first: "🔇 5 ч"
    repeat: "🔇 24 ч"
